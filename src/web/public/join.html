<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let’sGrow</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><span class="wordmark">Let’s<span>Grow.</span></span></header>
<main><div class="center hero" id="root"></div></main>
<script>
const token = location.pathname.split("/").pop();
const root = document.getElementById("root");
const el = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) k === "class" ? e.className = v : e.setAttribute(k, v); for (const x of kids) e.append(x); return e; };
(async () => {
  const r = await fetch("/api/join/" + token);
  const info = await r.json();
  root.textContent = "";
  if (!r.ok) { root.append(el("h1", {}, "This invite", el("br"), el("span", { class: "acc" }, "has expired."))); return; }
  root.append(el("h1", {}, `${info.userName} wants you`, el("br"), el("span", { class: "acc" }, "in their corner.")));
  root.append(el("p", { class: "lede" }, `${info.days} days, one new habit. You only hear from their agent if they slip.`));
  const name = el("input", { placeholder: "First name", autocomplete: "given-name" });
  const phone = el("input", { placeholder: "iPhone number", type: "tel", autocomplete: "tel" });
  const err = el("div", { class: "err" });
  const btn = el("button", { class: "wide" }, "Count me in");
  btn.onclick = async () => {
    err.textContent = ""; btn.disabled = true;
    const res = await fetch("/api/join/" + token, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: name.value, phone: phone.value }) });
    const d = await res.json(); btn.disabled = false;
    if (!res.ok) { err.textContent = d.error; return; }
    root.textContent = "";
    root.append(el("h1", {}, "Say hi to", el("br"), el("span", { class: "acc" }, `${d.userName}'s agent.`)));
    root.append(el("p", { class: "lede" }, "Send any text from the number you just entered."));
    root.append(el("a", { class: "btn wide", href: d.sms }, "Open Messages"));
    root.append(el("p", { class: "mute small center-text" }, d.number));
  };
  root.append(el("div", { class: "form" }, name, phone, btn, err));
})();
</script>
</body>
</html>
